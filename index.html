<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ea;
    --ink: #1f3d2b;
    --muted: #6b7d70;
    --like: #2fbf71;
    --nope: #ff5c6c;
    --super: #3a9bff;
    --pink: #ff5a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  }
  body { position: fixed; inset: 0; }
  button { font-family: inherit; color: inherit; }

  .app {
    height: 100%; max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 14px);
  }

  /* Header */
  header { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .logo b { color: var(--pink); font-weight: 700; }
  .logo svg { width: 28px; height: 28px; }
  .icon-btn {
    position: relative; width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #fff; box-shadow: 0 2px 10px rgba(31,61,43,.12);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .badge {
    position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: var(--pink); color: #fff; font-size: 12px; font-weight: 800;
    display: grid; place-items: center;
  }
  .badge:empty { display: none; }
  .badge.bump { animation: bump .4s; }

  /* Card deck */
  .deck { position: relative; flex: 1; min-height: 0; margin: 6px 0 16px; touch-action: none; }
  .card {
    position: absolute; inset: 0; border-radius: 24px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(31,61,43,.18);
    user-select: none; -webkit-user-select: none; touch-action: none;
    transition: transform .35s cubic-bezier(.2,.8,.3,1.1);
    will-change: transform; cursor: grab;
  }
  .card:active { cursor: grabbing; }
  .card.pos-0 { z-index: 3; }
  .card.pos-1 { z-index: 2; transform: scale(.94); pointer-events: none; }
  .card.pos-2 { z-index: 1; transform: scale(.88); pointer-events: none; }

  .art { position: absolute; top: 0; left: 0; right: 0; bottom: 32%; display: flex; align-items: center; justify-content: center; padding-top: 18px; }
  .art svg { height: 100%; max-width: 92%; }

  .info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 64px 20px 18px; color: #fff;
    background: linear-gradient(to top, rgba(18,40,26,.94) 0%, rgba(18,40,26,.82) 62%, rgba(18,40,26,0) 100%);
  }
  .info h2 { margin: 0; font-family: 'Fraunces', serif; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; }
  .info h2 span { font-family: 'Nunito', sans-serif; font-weight: 400; font-size: 24px; opacity: .9; }
  .meta { margin-top: 4px; font-size: 14px; opacity: .85; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .bio {
    margin: 10px 0 0; font-size: 15.5px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .more { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .card.expanded .more { max-height: 320px; }
  .card.expanded .bio { -webkit-line-clamp: unset; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags span { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .prompt { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.1); }
  .prompt small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; margin-bottom: 3px; }
  .prompt div { font-family: 'Fraunces', serif; font-size: 17px; line-height: 1.3; }
  .hint { margin-top: 10px; font-size: 12px; opacity: .55; text-align: center; }
  .card.expanded .hint::after { content: 'Tap to show less'; }
  .card:not(.expanded) .hint::after { content: 'Tap for more'; }

  .stamp {
    position: absolute; z-index: 5; top: 30px; padding: 4px 12px;
    font-weight: 800; font-size: 32px; letter-spacing: .04em; line-height: 1;
    border: 4px solid; border-radius: 10px; opacity: 0; pointer-events: none;
    background: rgba(255,255,255,.35);
  }
  .stamp.like { left: 22px; color: var(--like); transform: rotate(-14deg); }
  .stamp.nope { right: 22px; color: var(--nope); transform: rotate(14deg); }
  .stamp.super { top: 36%; left: 50%; color: var(--super); transform: translateX(-50%) rotate(-8deg); text-align: center; font-size: 26px; }

  /* Action buttons */
  .actions { flex: none; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .act {
    border: none; background: #fff; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(31,61,43,.15);
    transition: transform .15s;
  }
  .act:active { transform: scale(.86); }
  .act.big { width: 66px; height: 66px; }
  .act.small { width: 52px; height: 52px; }
  .act svg { width: 48%; height: 48%; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; overflow: hidden; }
  .overlay.show { display: flex; animation: fade .3s ease; }

  .intro { background: var(--bg); }
  .intro-inner { max-width: 360px; }
  .intro .hero { width: 170px; height: 200px; margin: 0 auto 6px; }
  .intro h1 { font-family: 'Fraunces', serif; font-size: 36px; margin: 0 0 10px; letter-spacing: -0.02em; line-height: 1.05; }
  .intro h1 b { color: var(--pink); }
  .intro p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 8px; }
  .howto { display: flex; justify-content: center; gap: 18px; margin: 20px 0 26px; font-size: 13px; color: var(--muted); }
  .howto div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .howto strong { font-size: 22px; }

  .match { background: radial-gradient(circle at 50% 30%, rgba(46,120,72,.95), rgba(14,34,22,.97)); color: #fff; }
  .match-inner { position: relative; z-index: 2; width: 100%; max-width: 380px; }
  .match-title {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 54px; margin: 0 0 10px; line-height: 1;
    background: linear-gradient(90deg, #b8f5c8, #ffd1dc); -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: pop .55s cubic-bezier(.2,1.6,.4,1);
  }
  .match p { font-size: 17px; line-height: 1.45; margin: 0 auto; max-width: 320px; opacity: .92; }
  .avatars { display: flex; justify-content: center; margin: 30px 0 34px; }
  .avatar {
    width: 124px; height: 124px; border-radius: 50%; border: 4px solid #fff; overflow: hidden;
    display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .avatar svg { height: 94%; margin-top: 6px; }
  .avatar.you { transform: translateX(12px) rotate(-8deg); animation: inL .5s cubic-bezier(.2,1.4,.4,1); }
  .avatar.them { transform: translateX(-12px) rotate(8deg); animation: inR .5s cubic-bezier(.2,1.4,.4,1); }
  .btn {
    display: block; width: 100%; max-width: 320px; margin: 10px auto 0; padding: 15px;
    border-radius: 999px; font-weight: 800; font-size: 16px; border: none; cursor: pointer;
  }
  .btn.primary { background: linear-gradient(90deg, #ff5a7a, #ff8a5c); color: #fff; box-shadow: 0 6px 18px rgba(255,90,122,.35); }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.55); }
  .btn.dark { background: var(--ink); color: #fff; }
  .falling { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .falling span { position: absolute; top: -50px; animation: fall linear forwards; }

  /* Matches sheet */
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(15,35,22,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 460px; max-height: 78%; margin: 0 auto;
    background: #fff; border-radius: 24px 24px 0 0;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
  .sheet-head h3 { margin: 0; font-family: 'Fraunces', serif; font-size: 24px; }
  .sheet-head button { border: none; background: #f0ece2; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .sheet ul { list-style: none; margin: 0; padding: 0 16px 18px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .sheet li { display: flex; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f0ece2; }
  .sheet li:last-child { border-bottom: none; }
  .mini { flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; }
  .mini svg { height: 94%; margin-top: 4px; }
  .sheet li strong { display: block; font-size: 16px; }
  .sheet li span { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .empty { color: var(--muted); text-align: center; padding: 10px 30px 34px; margin: 0; line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 110px); z-index: 60;
    width: max-content; max-width: calc(100% - 40px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.4; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); transition: all .3s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .heart-beat { transform-origin: 100px 74px; animation: beat 1.2s ease-in-out infinite; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  @keyframes inL { from { transform: translateX(-160px) rotate(-30deg); opacity: 0; } }
  @keyframes inR { from { transform: translateX(160px) rotate(30deg); opacity: 0; } }
  @keyframes fall { to { transform: translateY(115vh) rotate(600deg); } }
  @keyframes bump { 50% { transform: scale(1.4); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
  @media (max-height: 640px) {
    .info { padding-top: 48px; }
    .info h2 { font-size: 26px; }
    .bio { -webkit-line-clamp: 2; font-size: 14.5px; }
    .act.big { width: 58px; height: 58px; }
    .act.small { width: 46px; height: 46px; }
  }
</style>
</head>

};

function faceSvg(kind, k) {
  const blush = `<ellipse cx="78" cy="214" rx="6" ry="3.5" fill="#ff8fa3" opacity=".6"/><ellipse cx="122" cy="214" rx="6" ry="3.5" fill="#ff8fa3" opacity=".6"/>`;
  const smile = `<path d="M93 213 Q100 220 107 213" stroke="${k}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const dot = x => `<circle cx="${x}" cy="205" r="3.6" fill="${k}"/>`;
  const happyEye = x => `<path d="M${x - 4} 206 Q${x} 200 ${x + 4} 206" stroke="${k}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const shut = x => `<path d="M${x - 4} 204 Q${x} 208 ${x + 4} 204" stroke="${k}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const heart = x => `<path transform="translate(${x} 205) scale(1.1)" d="M0 4 C-7 -1 -4 -7 0 -3 C4 -7 7 -1 0 4Z" fill="#e63946"/>`;
  switch (kind) {
    case "wink": return dot(88) + happyEye(112) + smile + blush;
    case "cool": return `<g fill="#151515"><rect x="77" y="199" width="19" height="11" rx="4"/><rect x="104" y="199" width="19" height="11" rx="4"/><rect x="95" y="201.5" width="10" height="2.5"/></g><path d="M81 202 l4 0" stroke="#fff" stroke-width="1.5" opacity=".6" stroke-linecap="round"/><path d="M108 202 l4 0" stroke="#fff" stroke-width="1.5" opacity=".6" stroke-linecap="round"/>` + smile;
    case "smitten": return heart(88) + heart(112) + smile + blush;
    case "sleepy": return shut(88) + shut(112) + `<ellipse cx="100" cy="215" rx="3" ry="2.6" fill="${k}"/>` + blush;
    default: return dot(88) + dot(112) + smile + blush;
  }
}

function art(p) {
  const [back, front = ""] = PLANTS[p.type](p);
  if (p.portrait) return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${back}</svg>`;
  const pot = p.pot, ink = isDark(pot) ? "#ffffff" : "#2b2b2b";
  return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="100" cy="236" rx="46" ry="5" fill="#000" opacity=".08"/>
    ${back}
    <path d="M64 186 L136 186 L128 230 Q127 235 122 235 L78 235 Q73 235 72 230 Z" fill="${pot}" stroke="${shade(pot, -24)}" stroke-width="1.5"/>
    <rect x="56" y="172" width="88" height="18" rx="5" fill="${shade(pot, -14)}" stroke="${shade(pot, -30)}" stroke-width="1.5"/>
    ${faceSvg(p.face, ink)}
    ${front}
  </svg>`;
}

/* ===================== App logic ===================== */
const $ = s => document.querySelector(s);
const deckEl = $("#deck");
let queue = [], stack = [], matches = [];
let swipes = 0, likes = 0, busy = false;
let specialDue = ANNIVERSARY.enabled ? ANNIVERSARY.showAfterSwipes : Infinity;
let specialMatched = false;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function nextProfile() {
  if (swipes + stack.length >= specialDue && !specialMatched) {
    specialDue = Infinity;
    return SPECIAL;
  }
  if (!queue.length) {
    const visible = new Set(stack.map(c => c.p));
    queue = shuffle(PROFILES.filter(p => !visible.has(p)));
  }
  return queue.shift();
}

function cardEl(p) {
  const el = document.createElement("article");
  el.className = "card";
  el.style.background = `linear-gradient(165deg, ${p.bg[0]}, ${p.bg[1]})`;
  el.innerHTML = `
    <div class="art">${art(p)}</div>
    <div class="stamp like">LIKE</div>
    <div class="stamp nope">NOPE</div>
    <div class="stamp super">SUPER<br>LIKE</div>
    <div class="info">
      <h2>${p.name} <span>${p.age}</span></h2>
      <div class="meta"><span>🌱 ${p.species}</span><span>📍 ${p.distance}</span></div>
      <p class="bio">${p.bio}</p>
      <div class="more">
        <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>
        <div class="prompt"><small>${p.prompt[0]}</small><div>${p.prompt[1]}</div></div>
      </div>
      <div class="hint"></div>
    </div>`;
  return el;
}

function addCardBottom() {
  const p = nextProfile();
  const el = cardEl(p);
  deckEl.prepend(el);
  stack.push({ p, el });
  attachDrag(el);
}
function layout() {
  stack.forEach((c, i) => {
    c.el.classList.remove("pos-0", "pos-1", "pos-2");
    c.el.classList.add("pos-" + Math.min(i, 2));
  });
}

function setStamps(el, dx, dy) {
  const cl = v => Math.max(0, Math.min(1, v));
  el.querySelector(".like").style.opacity = cl(dx / 90);
  el.querySelector(".nope").style.opacity = cl(-dx / 90);
  el.querySelector(".super").style.opacity = cl((-dy - Math.abs(dx)) / 90);
}

function attachDrag(el) {
  let d = null;
  el.addEventListener("pointerdown", e => {
    if (busy || el !== stack[0]?.el) return;
    el.setPointerCapture(e.pointerId);
    d = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, hist: [[e.clientX, e.clientY, performance.now()]] };
    el.style.transition = "none";
  });
  el.addEventListener("pointermove", e => {
    if (!d) return;
    d.dx = e.clientX - d.x; d.dy = e.clientY - d.y;
    if (Math.hypot(d.dx, d.dy) > 8) d.moved = true;
    d.hist.push([e.clientX, e.clientY, performance.now()]);
    if (d.hist.length > 5) d.hist.shift();
    el.style.transform = `translate(${d.dx}px, ${d.dy}px) rotate(${d.dx * 0.06}deg)`;
    setStamps(el, d.dx, d.dy);
    const next = stack[1]?.el;
    if (next) {
      const prog = Math.min(1, Math.hypot(d.dx, d.dy) / 150);
      next.style.transition = "none";
      next.style.transform = `scale(${0.94 + 0.06 * prog})`;
    }
  });
  const end = () => {
    if (!d) return;
    const { dx, dy, moved, hist } = d;
    d = null;
    const next = stack[1]?.el;
    if (!moved) {
      el.style.transition = ""; el.style.transform = "";
      if (next) { next.style.transition = ""; next.style.transform = ""; }
      el.classList.toggle("expanded");
      return;
    }
    const [x0, y0, t0] = hist[0], [x1, y1, t1] = hist[hist.length - 1];
    const dt = Math.max(1, t1 - t0), vx = (x1 - x0) / dt, vy = (y1 - y0) / dt;
    const w = el.offsetWidth, h = el.offsetHeight;
    el.dataset.dx = dx; el.dataset.dy = dy;
    if (dx > w * 0.28 || (vx > 0.5 && dx > 40)) swipe("right");
    else if (dx < -w * 0.28 || (vx < -0.5 && dx < -40)) swipe("left");
    else if ((dy < -h * 0.2 || (vy < -0.5 && dy < -40)) && Math.abs(dx) < w * 0.3) swipe("up");
    else {
      el.style.transition = "transform .35s cubic-bezier(.2,.9,.3,1.3)";
      el.style.transform = "";
      setStamps(el, 0, 0);
      if (next) { next.style.transition = ""; next.style.transform = ""; }
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function swipe(dir) {
  if (busy || !stack.length) return;
  busy = true;
  const top = stack.shift();
  const el = top.el;
  const W = window.innerWidth, H = window.innerHeight;
  const dx = +el.dataset.dx || 0, dy = +el.dataset.dy || 0;
  el.querySelector(dir === "right" ? ".like" : dir === "left" ? ".nope" : ".super").style.opacity = 1;
  el.style.transition = "transform .45s cubic-bezier(.3,.6,.4,1)";
  el.style.pointerEvents = "none";
  requestAnimationFrame(() => {
    if (dir === "right") el.style.transform = `translate(${W + 200}px, ${dy + 60}px) rotate(30deg)`;
    else if (dir === "left") el.style.transform = `translate(${-W - 200}px, ${dy + 60}px) rotate(-30deg)`;
    else el.style.transform = `translate(${dx}px, ${-H - 200}px) rotate(${dx * 0.05}deg)`;
  });

  swipes++;
  stack.forEach(c => { c.el.style.transition = ""; c.el.style.transform = ""; });
  addCardBottom();
  layout();

  let matched = false;
  const p = top.p;
  if (p.special) {
    if (dir === "left") { specialDue = swipes + 3; p.bio = ANNIVERSARY.secondChanceBio; }
    else { matched = true; specialMatched = true; }
  } else if (dir !== "left") {
    likes++;
    matched = Math.random() < (dir === "up" ? 0.8 : 0.4) || (likes >= 3 && matches.length === 0);
  }

  setTimeout(() => {
    el.remove();
    busy = false;
    if (matched) showMatch(p);
  }, 400);
}

/* ===================== Match + extras ===================== */
let currentMatch = null;

function showMatch(p) {
  currentMatch = p;
  if (!matches.some(m => m.p === p)) {
    matches.unshift({ p, line: pick(LINES) });
    const badge = $("#badge");
    badge.textContent = matches.length;
    badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump");
  }
  $("#matchTitle").textContent = p.special ? ANNIVERSARY.matchTitle : "It's a Match!";
  $("#matchText").textContent = p.special ? ANNIVERSARY.matchText : pick(MATCH_TEXTS)(p.name);
  const you = $("#avYou"), them = $("#avThem");
  you.innerHTML = art(YOU); you.style.background = `linear-gradient(165deg, ${YOU.bg[0]}, ${YOU.bg[1]})`;
  them.innerHTML = art(p); them.style.background = `linear-gradient(165deg, ${p.bg[0]}, ${p.bg[1]})`;
  $("#sendBtn").style.display = p.special ? "none" : "";
  $("#keepBtn").textContent = p.special ? "Keep swiping 💚" : "Keep swiping";
  // restart avatar animations
  [you, them].forEach(a => { a.style.animation = "none"; void a.offsetWidth; a.style.animation = ""; });
  $("#match").classList.add("show");
  rain(p.special ? ["💚", "💕", "🌱", "🌸", "💖"] : ["🍃", "🌿", "🌱", "🌸", "💚"], p.special ? 50 : 28);
}
function closeMatch() {
  $("#match").classList.remove("show");
  $("#falling").innerHTML = "";
}
function rain(emojis, n) {
  const box = $("#falling");
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.textContent = pick(emojis);
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = 16 + Math.random() * 22 + "px";
    s.style.animationDuration = 2.6 + Math.random() * 2.4 + "s";
    s.style.animationDelay = Math.random() * 1.6 + "s";
    box.appendChild(s);
  }
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

function openSheet() {
  const list = $("#matchList");
  list.innerHTML = matches.map(m => `
    <li>
      <div class="mini" style="background:linear-gradient(165deg, ${m.p.bg[0]}, ${m.p.bg[1]})">${art(m.p)}</div>
      <div><strong>${m.p.name}</strong><span>${m.p.special ? "💚 " + ANNIVERSARY.matchText : "“" + m.line + "”"}</span></div>
    </li>`).join("");
  $("#emptyMsg").style.display = matches.length ? "none" : "";
  $("#sheet").classList.add("open");
  $("#sheetBg").classList.add("open");
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#sheetBg").classList.remove("open");
}

/* ===================== Wire up ===================== */
$("#introArt").innerHTML = art(Object.assign({}, YOU, { face: "happy" }));
$("#startBtn").onclick = () => $("#intro").classList.remove("show");
$("#nopeBtn").onclick = () => swipe("left");
$("#likeBtn").onclick = () => swipe("right");
$("#superBtn").onclick = () => swipe("up");
$("#keepBtn").onclick = closeMatch;
$("#sendBtn").onclick = () => {
  const name = currentMatch?.name;
  closeMatch();
  toast(`You sent ${name}: “${pick(LINES)}”`);
};
$("#matchesBtn").onclick = openSheet;
$("#closeSheet").onclick = closeSheet;
$("#sheetBg").onclick = closeSheet;

document.addEventListener("keydown", e => {
  if ($("#intro").classList.contains("show") || $("#match").classList.contains("show")) {
    if (e.key === "Enter" || e.key === "Escape") { $("#intro").classList.remove("show"); closeMatch(); }
    return;
  }
  if (e.key === "ArrowLeft") swipe("left");
  else if (e.key === "ArrowRight") swipe("right");
  else if (e.key === "ArrowUp") swipe("up");
  else if (e.key === "Escape") closeSheet();
});

queue = shuffle(PROFILES.slice());
for (let i = 0; i < 3; i++) addCardBottom();
layout();
</script>
</body>
</html>
